<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Wizzy Official</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101820;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: #1d2b36;
      padding: 30px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
    }
    h2 { text-align: center; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      box-sizing: border-box;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #e5b93f;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
    }
    p { line-height: 1.5; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>WIZZY OFFICIAL</h2>
    <p id="instruction">Enter your email to receive a password reset link.</p>

    <form id="emailForm">
      <input type="email" id="email" placeholder="Your email" required>
      <button type="submit">Send Reset Link</button>
    </form>

    <form id="passwordForm" hidden>
      <input type="password" id="password" placeholder="New password (at least 8 characters)" minlength="8" required>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" required>
      <button type="submit">Update Password</button>
    </form>

    <p id="message"></p>
    <p><a href="admin.html" style="color:#e5b93f">Back to Admin Login</a></p>
  </div>

  <script>
    <script>
    const config = window.WIZZY_CONFIG;

    const supabaseClient = window.supabase.createClient(
      config.SUPABASE_URL,
      config.SUPABASE_ANON_KEY
    );

    const emailForm = document.getElementById("emailForm");
    const passwordForm = document.getElementById("passwordForm");
    const instruction = document.getElementById("instruction");
    const message = document.getElementById("message");

    function showPasswordForm() {
      emailForm.hidden = true;
      passwordForm.hidden = false;
      instruction.textContent = "Enter your new password below.";
    }

    if (window.location.hash.includes("type=recovery")) {
      showPasswordForm();
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || (event === "SIGNED_IN" && window.location.hash.includes("type=recovery"))) {
        showPasswordForm();
      }
    });

    emailForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "Sending reset link...";

      const { error } = await supabaseClient.auth.resetPasswordForEmail(
        document.getElementById("email").value.trim(),
        {
          redirectTo: window.location.origin + "/wizzyofficial/reset-password.html"
        }
      );

      message.textContent = error
        ? error.message
        : "Reset link sent. Check your email.";
    });

    passwordForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Updating password...";

      const { error } = await supabaseClient.auth.updateUser({
        password: password
      });

      message.textContent = error
        ? error.message
        : "Password updated successfully. You can now log in to Admin Dashboard.";

      if (!error) {
        passwordForm.hidden = true;
        instruction.textContent = "Your password has been changed.";
      }
    });
  </script>
</body>
</html>
